name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    name: Build the installable module zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: The tag matches the module version
        run: |
          tag=${GITHUB_REF_NAME#v}
          found=$(grep -oP "\\\$this->version = '\K[^']+" ruvelo_securityalerts.php)
          [ "$tag" = "$found" ] || { echo "::error::tag $tag but ruvelo_securityalerts.php says $found"; exit 1; }

      - name: Build (the module with its own vendor/)
        run: bin/build-zip.sh "build/ruvelo_securityalerts-${GITHUB_REF_NAME#v}.zip"

      - name: The zip has what a shop needs
        run: |
          unzip -l build/ruvelo_securityalerts-*.zip | tee list.txt
          grep -q ' ruvelo_securityalerts/ruvelo_securityalerts.php' list.txt
          grep -q ' ruvelo_securityalerts/vendor/autoload.php' list.txt
          grep -q ' ruvelo_securityalerts/vendor/ruvelo/security-advisories/' list.txt
          ! grep -qE ' ruvelo_securityalerts/(tests|\.github)/' list.txt

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file <(sed -n "/^## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          gh release upload "$GITHUB_REF_NAME" build/ruvelo_securityalerts-*.zip --clobber
